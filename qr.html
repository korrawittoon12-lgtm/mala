<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>พิมพ์ QR ของร้าน</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem; font-family: 'Anuphan', 'Thonburi', system-ui, sans-serif; color: #15251D; line-height: 1.5; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  .form { display: grid; gap: .75rem; max-width: 34rem; margin-bottom: 1.5rem; }
  label { font-weight: 600; display: block; }
  input[type=text], input[type=number] { width: 100%; padding: .625rem; font: inherit; border: 1.5px solid #15251D; border-radius: 10px; }
  .check { font-weight: 400; display: flex; gap: .5rem; align-items: center; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; min-height: 2.75rem; padding: 0 1.25rem; border-radius: 10px; border: 1.5px solid #15251D; background: #F4C542; cursor: pointer; }
  .msg { color: #8A0C14; font-weight: 500; margin: 0; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 1rem; }
  .tag { border: 2px solid #15251D; border-radius: 12px; padding: 1rem; text-align: center; break-inside: avoid; }
  .tag h2 { margin: 0 0 .5rem; font-size: 1.75rem; }
  .tag .code { display: grid; place-items: center; }
  .tag .code img, .tag .code canvas { width: 100%; max-width: 11rem; height: auto; }
  .tag p { margin: .5rem 0 0; }
  @media print {
    .form, h1 { display: none; }
    body { padding: 0; }
    .sheet { grid-template-columns: repeat(3, 1fr); gap: .5cm; }
  }
</style>
</head>
<body>
<h1>พิมพ์ QR ของร้าน</h1>

<div class="form">
  <div>
    <label for="link">ลิงก์ของร้านจาก LINE</label>
    <input type="text" id="link" placeholder="https://liff.line.me/1234567890-AbcdEfgh">
  </div>
  <div>
    <label for="count">จำนวนใบที่จะพิมพ์</label>
    <input type="number" id="count" min="1" max="60" value="6">
  </div>
  <p class="msg" id="msg" role="alert"></p>
  <div class="row">
    <button type="button" id="make">สร้าง QR</button>
    <button type="button" id="print">พิมพ์</button>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  'use strict';
  const CFG = Object.assign({ LIFF_ID: '', SHOP_NAME: '' }, window.SHOP_CONFIG || {});
  const $ = id => document.getElementById(id);
  if (CFG.LIFF_ID) $('link').value = 'https://liff.line.me/' + CFG.LIFF_ID;

  // ทุกใบเป็น QR เดียวกัน (ร้านไม่ใช้เลขโต๊ะ) พิมพ์หลายใบไว้ติดตามโต๊ะหรือหน้าร้านได้
  function make() {
    const link = $('link').value.trim().replace(/[?#].*$/, '').replace(/\/+$/, '');
    const n = Math.max(1, Math.min(60, Math.floor(Number($('count').value) || 1)));
    $('sheet').innerHTML = '';
    if (!/^https:\/\/.+/.test(link)) { $('msg').textContent = 'ใส่ลิงก์ของร้านก่อน (ขึ้นต้นด้วย https://)'; return; }
    if (typeof QRCode === 'undefined') { $('msg').textContent = 'โหลดตัวสร้าง QR ไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่'; return; }
    $('msg').textContent = '';

    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'tag';
      const h = document.createElement('h2'); h.textContent = CFG.SHOP_NAME || 'สั่งอาหาร';
      const code = document.createElement('div'); code.className = 'code';
      const p = document.createElement('p'); p.textContent = 'สแกนด้วย LINE เพื่อสั่งอาหาร';
      el.append(h, code, p);
      $('sheet').appendChild(el);
      new QRCode(code, { text: link, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M });
      code.removeAttribute('title');
    }
  }

  $('make').addEventListener('click', make);
  $('print').addEventListener('click', () => { if (!$('sheet').children.length) make(); if ($('sheet').children.length) window.print(); });
})();
</script>
</body>
</html>
