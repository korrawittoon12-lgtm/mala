<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ออเดอร์หลังร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* สีชุดเดียวกับหน้าเมนูของลูกค้า (แบบ C โทนเข้ม เลือกเมื่อ 26/10/2026)
       ชื่อสีเดิมยังใช้อยู่ทั้งไฟล์: --celadon = พื้นหน้า, --paper = พื้นการ์ด, --ink = สีตัวหนังสือ */
    color-scheme: dark;
    --chili: #E24A3B; --chili-deep: #FFB4A8;
    --celadon: #16120F; --celadon-line: #3A302A;
    --paper: #221C18; --paper-2: #2A211C; --ink: #F4EDE4; --ink-soft: #C9BCAE; --ink-mute: #A89A8B;
    --sesame: #D9B46A; --gold: #D9B46A; --gold-ink: #16120F; --ok: #7FD39B;
    --display: 'Noto Serif Thai', 'Thonburi', serif;
    --body: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Thonburi', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--celadon); color: var(--ink); font-family: var(--body); line-height: 1.5; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .top { background: var(--ink); color: var(--paper); padding: .75rem 1rem; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; }
  .top h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.375rem; }
  .top p { margin: 0; font-size: .9375rem; }
  .top p.bad { background: var(--chili); padding: .125rem .625rem; border-radius: 6px; }

  .gate { max-width: 24rem; margin: 3rem auto; padding: 0 1rem; }
  .gate label { display: block; font-weight: 600; margin-bottom: .375rem; }
  .gate input { width: 100%; padding: .75rem; font-size: 1.25rem; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff; }
  .gate .msg { color: var(--chili-deep); font-weight: 500; min-height: 1.5rem; margin: .5rem 0; }
  .btn { min-height: 3rem; padding: 0 1.25rem; border: 0; border-radius: 12px; background: var(--chili); color: #fff; font-weight: 600; width: 100%; }
  .btn.quiet { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
  .btn.small { width: auto; min-height: 2.75rem; }

  .board { display: grid; gap: 1rem; padding: 1rem; align-items: start; }
  @media (min-width: 52rem) { .board { grid-template-columns: repeat(3, 1fr); } }
  .col h2 { margin: 0 0 .5rem; font-family: var(--display); font-weight: 400; font-size: 1.25rem; display: flex; justify-content: space-between; }
  .col h2 span { font-family: var(--body); font-weight: 600; font-size: 1rem; }
  .empty { margin: 0; padding: 1rem; border: 1.5px dashed var(--celadon-line); border-radius: 12px; color: var(--ink-soft); }

  .card { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; margin-bottom: .75rem; overflow: hidden; }
  .card[data-status="ใหม่"] { border-color: var(--chili); border-width: 3px; }
  .card[data-status="เสร็จแล้ว"], .card[data-status="ยกเลิก"] { border-color: var(--celadon-line); color: var(--ink-soft); }
  .card-head { display: flex; align-items: center; gap: .75rem; padding: .625rem .75rem; border-bottom: 1px solid var(--celadon-line); }
  .card-table { background: var(--sesame); color: var(--ink); border-radius: 6px; padding: .125rem .625rem; font-family: var(--display); font-size: 1.5rem; line-height: 1.3; }
  .card-meta { flex: 1; line-height: 1.3; }
  .card-meta small { display: block; color: var(--ink-soft); }
  .card ul { list-style: none; margin: 0; padding: .5rem .75rem; }
  .card li { display: flex; justify-content: space-between; gap: .75rem; padding: .125rem 0; font-size: 1.125rem; }
  .card li b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* รายการยาว: ย่อเหลือ 5 บรรทัด กดปุ่มเพื่อดูทั้งหมด */
  .card ul.is-short { padding-bottom: 0; }
  .lines-toggle { display: flex; justify-content: space-between; align-items: center; gap: .5rem; width: calc(100% - 1.5rem); margin: .25rem .75rem .5rem; padding: .5rem .75rem;
    border: 1.5px dashed var(--ink-soft, #5E564B); border-radius: 10px; background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .lines-toggle .arrow { font-size: .875rem; }
  .tags { padding: 0 .75rem .5rem; }
  .tags p { margin: .25rem 0 0; }
  .spice { display: inline-block; background: var(--chili); color: #fff; border-radius: 6px; padding: 0 .5rem; font-weight: 600; }
  .note { background: #FFF6D6; border-radius: 6px; padding: .25rem .5rem; }
  .contact { margin: 0; padding: .5rem .75rem 0; }
  .contact a { color: inherit; font-weight: 600; font-size: 1.125rem; font-variant-numeric: tabular-nums; text-underline-offset: 3px; display: inline-block; padding: .25rem 0; }
  .regular { margin: .25rem .75rem 0; padding: .25rem .75rem; min-height: 2.5rem; background: #FFF6D6; border: 1.5px solid var(--ink); border-radius: 999px; font-weight: 500; }
  .card-photo { display: block; width: calc(100% - 1.5rem); margin: .5rem .75rem; padding: 0; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--celadon); }
  .card-photo img { display: block; width: 100%; height: 9rem; object-fit: cover; }
  .photo-wait { margin: .5rem .75rem; padding: .75rem; border: 1.5px dashed var(--celadon-line); border-radius: 10px; color: var(--ink-soft); }
  .photo-more { padding: .5rem .75rem 0; }
  /* สลิปที่ลูกค้าแนบ: เหลือง = รอตรวจ, แดง = สลิปซ้ำหรือไม่ผ่าน */
  .slip-row { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; margin: .5rem .75rem 0; padding: .375rem .625rem; border-radius: 8px; background: #FFF6D6; }
  .slip-row span { flex: 1 1 9rem; font-weight: 600; }
  .slip-row.is-warn { background: #FBE3E4; color: var(--chili-deep); }
  .viewer-actions { display: flex; gap: .5rem; margin-bottom: .5rem; }
  .viewer-actions .btn { flex: 1; }
  dialog { border: 0; border-radius: 16px; padding: .75rem; max-width: min(95vw, 60rem); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgb(21 37 29 / .75); }
  dialog img { display: block; max-width: 100%; max-height: 78vh; margin: 0 auto .75rem; border-radius: 10px; }
  #past { width: min(95vw, 32rem); max-height: 88vh; overflow-y: auto; padding: 1rem; }
  #past h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
  #past .who { margin: 0 0 .75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .past { padding: .625rem 0; border-top: 1px solid var(--celadon-line); }
  .past-head { display: flex; justify-content: space-between; gap: .75rem; font-weight: 600; }
  .past-head span { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .past p { margin: .125rem 0 0; color: var(--ink-soft); }
  .past .now { color: var(--chili-deep); font-weight: 500; }
  #past .btn { margin-top: .75rem; }
  /* แถบ "ปิดรับออเดอร์แล้ว" และแผ่นสรุปยอดของวัน */
  .closed-bar { margin: 0; padding: .625rem 1rem; background: var(--chili); color: #fff; font-weight: 600; text-align: center; }
  #sum { width: min(95vw, 34rem); max-height: 92vh; overflow-y: auto; padding: 1rem; }
  #sum h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
  #sum .who { margin: 0 0 .5rem; color: var(--ink-soft); }
  #sum .who.shut { color: var(--chili-deep); font-weight: 600; }
  .sum-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 1.125rem; }
  .sum-table td { padding: .3125rem 0; border-top: 1px solid var(--celadon-line); }
  .sum-table td + td { text-align: right; white-space: nowrap; padding-left: .75rem; }
  .sum-table td:last-child { color: var(--ink-soft); font-size: 1rem; }
  .sum-totals { margin: .75rem 0 0; font-variant-numeric: tabular-nums; }
  .sum-totals div { display: flex; justify-content: space-between; gap: 1rem; padding: .125rem 0; }
  .sum-totals .grand { margin-top: .375rem; padding-top: .375rem; border-top: 2px solid var(--ink); font-size: 1.5rem; font-weight: 600; }
  .sum-warn { margin: .625rem 0 0; padding: .375rem .625rem; background: #FFF6D6; border-radius: 8px; }
  #sum .msg { min-height: 1.5rem; margin: .625rem 0 0; font-weight: 500; }
  #sum .btn { margin-top: .5rem; }
  /* แท็บ วันนี้ / 7 วัน / เดือนนี้ / เดือนที่แล้ว ในแผ่นสรุปยอด */
  .sum-tabs { display: flex; gap: .375rem; margin: .5rem 0 .75rem; overflow-x: auto; }
  .sum-tabs button { flex: 1 0 auto; min-height: 2.5rem; padding: 0 .75rem; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font: inherit; font-weight: 600; white-space: nowrap; }
  .sum-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .rep-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; margin: 0 0 .75rem; }
  .rep-kpis div { padding: .5rem .625rem; border-radius: 10px; background: var(--celadon); }
  .rep-kpis small { display: block; color: var(--ink-soft); }
  .rep-kpis b { font-size: 1.375rem; font-variant-numeric: tabular-nums; }
  .rep-kpis .big { grid-column: 1 / -1; background: var(--ink); color: var(--paper); }
  .rep-kpis .big small { color: #D9D2C5; }
  .rep-kpis .big b { font-size: 1.75rem; }
  .rep h3 { margin: 1rem 0 .375rem; font-size: 1.0625rem; }
  .bars { margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  .bars li { display: grid; grid-template-columns: 3.25rem 1fr auto; align-items: center; gap: .5rem; padding: .1875rem 0; font-size: .9375rem; }
  .bars .bar { height: .875rem; border-radius: 4px; background: var(--chili); min-width: 2px; }
  .bars .bar.zero { background: var(--celadon-line); }
  .bars .bar.top { background: var(--chili-deep); }
  .bars .val { min-width: 4.5rem; text-align: right; color: var(--ink-soft); }
  .rep .unsold { margin: .25rem 0 0; padding: .5rem .625rem; border-radius: 8px; background: #FFF6D6; }
  /* แผ่น ของหมด / มีขาย */
  #stock { width: min(95vw, 34rem); max-height: 92vh; overflow-y: auto; padding: 1rem; }
  #stock h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
  #stock .who { margin: 0 0 .5rem; color: var(--ink-soft); }
  #stock h3 { margin: .875rem 0 .25rem; font-size: 1rem; color: var(--ink-soft); }
  .stock-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; width: 100%; min-height: 3.25rem; padding: .375rem 0; border: 0; border-top: 1px solid var(--celadon-line); background: none; color: var(--ink); font: inherit; font-size: 1.0625rem; text-align: left; }
  .stock-row .pill { flex: none; min-width: 5.5rem; padding: .375rem .75rem; border-radius: 999px; background: #1E6B3A; color: #fff; font-weight: 600; text-align: center; }
  .stock-row.is-out .pill { background: var(--chili); }
  .stock-row.is-out .name { color: var(--ink-soft); text-decoration: line-through; }
  .stock-row.is-busy { opacity: .55; }
  #stock .btn { margin-top: .75rem; }
  .card-foot { display: flex; gap: .5rem; padding: .625rem .75rem; border-top: 1px solid var(--celadon-line); align-items: center; }
  .card-foot .sum { flex: 1; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .card-foot .sum small { display: block; font-weight: 400; color: var(--chili-deep); }
  /* รับเงิน: ป้าย "จ่ายแล้ว" และปุ่มกดเมื่อได้รับเงิน */
  .paid-tag { display: inline-block; margin-left: .375rem; padding: 0 .5rem; border-radius: 6px; background: #1E6B3A; color: #fff; font-weight: 600; font-size: .9375rem; }
  .pay-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .5rem .75rem 0; }
  /* QR ให้ลูกค้าสแกนจากหน้าจอหลังร้าน */
  #payDlg { width: min(95vw, 30rem); padding: 1.25rem 1rem 1rem; text-align: center; }
  #payDlg h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1.3; }
  #payDlg .amount { margin: 0; font-size: 2.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  #payDlg .who { margin: .25rem 0 .75rem; color: var(--ink-soft); }
  .pay-qr { width: fit-content; margin: .5rem auto; padding: .75rem; background: #fff; border: 1.5px solid var(--ink); border-radius: 12px; }
  .pay-qr img, .pay-qr canvas { display: block; width: min(70vw, 18rem); height: min(70vw, 18rem); }
  .pay-row .btn { flex: 1; }
  .undo { background: none; border: 0; min-height: 2.75rem; padding: 0 .25rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }

  /* ===== แบบ C: ส่วนที่ต่างจากหน้าตาเดิม ===== */
  .top { background: #0F0C0A; color: var(--ink); border-bottom: 1px solid #2E2621; padding: .875rem 1.25rem; }
  .top h1 { font-weight: 700; font-size: 1.375rem; }
  .top p { color: var(--ink-mute); }
  .top p.bad { color: #fff; }
  .btn { border-radius: 14px; }
  .btn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--celadon-line); }
  .gate input { border: 1px solid var(--celadon-line); background: var(--paper); color: var(--ink); }
  .board { gap: 1.125rem; padding: 1.125rem 1.25rem; }
  .col h2 { align-items: center; justify-content: flex-start; gap: .5rem; font-family: var(--body); font-weight: 600; font-size: 1.125rem; }
  .col h2::before { content: ''; width: .625rem; height: .625rem; border-radius: 50%; background: var(--chili); }
  .col:nth-child(2) h2::before { background: var(--gold); }
  .col:nth-child(3) h2::before { background: var(--ok); }
  .col h2 span { color: var(--ink-mute); font-weight: 500; }
  .empty { border: 1px dashed var(--celadon-line); color: var(--ink-mute); }
  /* การ์ดออเดอร์: แถบสีด้านบนบอกสถานะ แดง = ใหม่, ทอง = กำลังทำ, เขียว = เสร็จแล้ว */
  .card { border: 0; border-top: 3px solid var(--celadon-line); border-radius: 18px; background: var(--paper); }
  .card[data-status="ใหม่"] { border-top: 3px solid var(--chili); box-shadow: 0 0 0 1px rgb(226 74 59 / .35); }
  .card[data-status="กำลังทำ"] { border-top-color: var(--gold); }
  .card[data-status="เสร็จแล้ว"] { border-top-color: var(--ok); color: var(--ink-soft); }
  .card[data-status="ยกเลิก"] { border-top-color: var(--celadon-line); color: var(--ink-mute); }
  .card-head { border-bottom-color: var(--celadon-line); }
  .card-table { background: none; color: var(--ink); padding: 0; font-weight: 700; font-size: 1.75rem; }
  .card li b { color: var(--gold); }
  .lines-toggle { border: 1px dashed var(--celadon-line); }
  .spice { background: rgb(226 74 59 / .18); color: #FFB4A8; }
  .note, .regular, .slip-row, .sum-warn, .rep .unsold { background: #3A2E1A; color: #F6D28E; }
  .regular { border: 1px solid #5A4A2A; }
  .slip-row.is-warn { background: #3D1A16; color: #FFB4A8; }
  .card-photo { border: 1px solid var(--celadon-line); }
  .photo-wait { border: 1px dashed var(--celadon-line); }
  .card-foot { border-top-color: var(--celadon-line); }
  .card-foot .btn:not(.quiet) { background: var(--gold); color: var(--gold-ink); }
  .card[data-status="ใหม่"] .card-foot .btn:not(.quiet) { background: var(--chili); color: #fff; }
  dialog { background: var(--paper); border: 1px solid var(--celadon-line); }
  dialog::backdrop { background: rgb(0 0 0 / .72); }
  #past h2, #sum h2, #stock h2, #payDlg h2 { font-weight: 700; }
  .sum-tabs button { border: 1px solid var(--celadon-line); background: transparent; }
  .sum-tabs button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .rep-kpis div { background: var(--paper-2); }
  .rep-kpis .big { background: var(--gold); color: var(--gold-ink); }
  .rep-kpis .big small { color: #4A3A1C; }
  .bars .bar { background: var(--gold); }
  .bars .bar.top { background: var(--chili); }
  .sum-totals .grand { border-top-color: var(--celadon-line); color: var(--gold); }
  .pay-qr { border: 0; }
</style>
</head>
<body>

<header class="top">
  <h1>ออเดอร์หลังร้าน</h1>
  <p id="status" role="status"></p>
  <button class="btn quiet small" id="soundBtn" type="button" hidden>แตะเพื่อเปิดเสียงเตือน</button>
  <button class="btn quiet small" id="stockBtn" type="button" hidden>ของหมด / มีขาย</button>
  <button class="btn quiet small" id="sumBtn" type="button" hidden>สรุปยอด / ปิดรับออเดอร์</button>
</header>
<p class="closed-bar" id="closedBar" role="status" hidden>ปิดรับออเดอร์แล้ว ลูกค้าสั่งเพิ่มไม่ได้ (เปิดรับใหม่ได้ที่ปุ่ม สรุปยอด)</p>

<section class="gate" id="gate">
  <label for="key">รหัสพนักงาน</label>
  <input id="key" inputmode="numeric" autocomplete="off">
  <p class="msg" id="gateMsg" role="alert"></p>
  <button class="btn" id="startBtn" type="button">เริ่มรับออเดอร์</button>
</section>

<main class="board" id="board" hidden>
  <section class="col"><h2>ออเดอร์ใหม่ <span id="n-new"></span></h2><div id="c-new"></div></section>
  <section class="col"><h2>กำลังทำ <span id="n-doing"></span></h2><div id="c-doing"></div></section>
  <section class="col"><h2>เสร็จแล้ว <span id="n-done"></span></h2><div id="c-done"></div></section>
</main>

<dialog id="past" aria-labelledby="pastTitle">
  <h2 id="pastTitle">ประวัติลูกค้า</h2>
  <p class="who" id="pastWho"></p>
  <div id="pastList"></div>
  <button class="btn quiet" type="button" id="pastClose">ปิด</button>
</dialog>

<dialog id="sum" aria-labelledby="sumTitle">
  <h2 id="sumTitle">สรุปยอดวันนี้</h2>
  <div class="sum-tabs" role="group" aria-label="ช่วงเวลา">
    <button type="button" data-range="today" aria-pressed="true">วันนี้</button>
    <button type="button" data-range="week" aria-pressed="false">7 วัน</button>
    <button type="button" data-range="month" aria-pressed="false">เดือนนี้</button>
    <button type="button" data-range="lastmonth" aria-pressed="false">เดือนที่แล้ว</button>
  </div>
  <p class="who" id="sumWhen"></p>
  <div id="sumBody"></div>
  <p class="msg" id="sumMsg" role="status"></p>
  <button class="btn" type="button" id="sumShut" hidden>ปิดรับออเดอร์</button>
  <button class="btn quiet" type="button" id="sumReopen" hidden>เปิดรับออเดอร์อีกครั้ง</button>
  <button class="btn quiet" type="button" id="sumBack">กลับไปหน้าออเดอร์</button>
</dialog>

<dialog id="stock" aria-labelledby="stockTitle">
  <h2 id="stockTitle">ของหมด / มีขาย</h2>
  <p class="who">แตะที่เมนูเพื่อสลับ ลูกค้าจะเห็นทันทีที่เปิดหรือโหลดเมนูใหม่</p>
  <div id="stockList"></div>
  <p class="msg" id="stockMsg" role="status"></p>
  <button class="btn quiet" type="button" id="stockClose">กลับไปหน้าออเดอร์</button>
</dialog>

<dialog id="payDlg" aria-labelledby="payDlgTitle">
  <h2 id="payDlgTitle"></h2>
  <p class="amount" id="payDlgAmount"></p>
  <div class="pay-qr" id="payDlgQr"></div>
  <p class="who" id="payDlgTo"></p>
  <div class="viewer-actions" id="payDlgActions"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
(() => {
  'use strict';
  // ALERT_SOUND = ไฟล์เสียงที่เล่นเมื่อมีออเดอร์ใหม่ (วางไว้ข้างไฟล์นี้) ALERT_TIMES = เล่นกี่รอบต่อหนึ่งออเดอร์
  // จะเปลี่ยนเสียง: เอาไฟล์ใหม่มาแทนโดยใช้ชื่อเดิม หรือใส่ชื่อไฟล์ใหม่ใน config.js ถ้าใส่ '' จะใช้เสียงติ๊ดแบบเดิม
  const CFG = Object.assign({ API_URL: '', ALERT_SOUND: 'alert.mp3', ALERT_TIMES: 2 }, window.SHOP_CONFIG || {});
  const POLL_MS = 3000;       // ถามหาออเดอร์ใหม่ทุก 3 วินาที (ถ้ารอบก่อนยังไม่ตอบ จะข้ามไปรอบถัดไป ไม่ถามซ้อน)
  const KEY_STORE = 'mala-staff-key';
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '฿' + Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });

  let key = '';
  let orders = [];
  let known = null;           // เลขออเดอร์ที่เคยเห็นแล้ว ใช้ตัดสินว่าควรส่งเสียงเตือนไหม
  let payTo = '';             // ข้อความบอกบัญชีพร้อมเพย์ของร้าน เช่น "บัญชีลงท้าย 3398"
  let slipsSeen = null;       // ออเดอร์ที่เคยเห็นว่ามีสลิปแล้ว ใช้ตัดสินว่าควรส่งเสียงติ๊ดเมื่อมีสลิปใหม่
  const EXPANDED_KEY = 'mala-kitchen-expanded';
  const expanded = new Set((() => { try { return JSON.parse(localStorage.getItem(EXPANDED_KEY) || '[]'); } catch (e) { return []; } })());   // การ์ดที่กางรายการไว้
  const pendingSlip = new Map();  // เลขออเดอร์ -> { state, at } ที่เพิ่งกด "สลิปไม่ถูกต้อง" บนเครื่องนี้
  let timer = null;
  let busy = false;
  let audio = null;
  let alertBuf = null;        // เสียงเตือนของร้านที่โหลดและถอดรหัสแล้ว ถ้ายังไม่มีหรือโหลดไม่ได้ จะใช้เสียงติ๊ดแทน
  let alertTries = 0;
  const photos = new Map();   // เลขออเดอร์ -> รูป (โหลดครั้งเดียวแล้วจำไว้)
  const photoFailed = new Set();
  let photoBusy = false;
  // สถานะที่พนักงานเพิ่งกดบนเครื่องนี้ และหลังร้านยังบันทึกไม่เสร็จหรือยังส่งกลับมาไม่ทัน
  // ใช้กันไม่ให้การ์ดเด้งกลับไปช่องเดิม เมื่อการดึงออเดอร์รอบถัดไปได้ข้อมูลเก่ามาก่อน
  const pending = new Map();  // เลขออเดอร์ -> { status, at }
  const PENDING_MS = 45000;   // ถ้านานกว่านี้แล้วหลังร้านยังไม่ตรง ให้เชื่อหลังร้าน
  const pendingPaid = new Map();  // เลขออเดอร์ -> { paid, at } ที่เพิ่งกด "รับเงินแล้ว" บนเครื่องนี้ (กันเด้งกลับแบบเดียวกับสถานะ)
  let closed = false;         // ร้านกดปิดรับออเดอร์ของวันนี้แล้วหรือยัง (หลังร้านเป็นคนบอก)
  let sumBusy = false;
  let armedAt = 0;            // เวลาที่กดปุ่มปิดรับครั้งแรก ต้องกดซ้ำอีกครั้งเพื่อยืนยัน

  // ออเดอร์ตัวอย่าง ใช้ตอนยังไม่ได้ใส่ API_URL
  const demoPhoto = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="640" height="420" fill="#C5D6CA"/>' +
    '<rect x="150" y="190" width="340" height="24" rx="6" fill="#4B5E53"/><rect x="180" y="214" width="16" height="130" fill="#4B5E53"/>' +
    '<rect x="444" y="214" width="16" height="130" fill="#4B5E53"/><circle cx="320" cy="160" r="34" fill="#B5121B"/>' +
    '<text x="320" y="390" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#15251D">รูปตัวอย่าง</text></svg>');
  const demo = [
    { id: 'demo-001', queue: '001', time: '12:01', table: '', customer: 'คุณเอ', phone: '0812345678', visits: 3, hasPhoto: true, spice: 'เผ็ดกลาง', note: 'ไม่ใส่ผักชี', status: 'กำลังทำ', total: 120, discount: 12,
      slip: { has: true, state: 'รอตรวจ', dup: false },
      lines: [{ name: 'หมูสไลซ์', qty: 5 }, { name: 'เห็ดเข็มทอง', qty: 3 }, { name: 'ลูกชิ้นปลา', qty: 3 }] },
    { id: 'demo-002', queue: '002', time: '12:06', table: '', customer: '', phone: '0898765432', hasPhoto: true, spice: 'เผ็ดมาก', note: '', status: 'ใหม่', total: 54, discount: 0,
      lines: [{ name: 'เนื้อวัวสไลซ์', qty: 2 }, { name: 'ปลาหมึกสด', qty: 2 }] },
  ];

  // สรุปยอดตัวอย่าง คิดจากออเดอร์ตัวอย่างด้านบน (โหมดทดลองเท่านั้น ของจริงหลังร้านเป็นคนคิด)
  let demoShut = false, demoShutAt = '';
  const demoMenu = [
    { cat: 'เนื้อสัตว์', name: 'หมูสไลซ์', price: 12, unit: 'ไม้', available: true },
    { cat: 'เนื้อสัตว์', name: 'ไก่หมัก', price: 12, unit: 'ไม้', available: true },
    { cat: 'ลูกชิ้นและเต้าหู้', name: 'ลูกชิ้นปลา', price: 12, unit: 'ไม้', available: true },
    { cat: 'ผัก', name: 'เห็ดเข็มทอง', price: 12, unit: 'ไม้', available: false },
    { cat: 'หมึกย่าง', name: 'ปลาหมึกสด', price: 15, unit: 'ไม้', available: true },
  ];
  // สรุปยอดตัวอย่างสำหรับโหมดทดลอง ตัวเลขสมมติ
  function demoReport(range) {
    const n = range === 'week' ? 7 : range === 'month' ? 21 : 30;
    const byDay = Array.from({ length: n }, (_, i) => ({ day: '', label: (i + 1) + '/10', orders: (i * 7) % 11 + 4, total: ((i * 7) % 11 + 4) * 96 }));
    const total = byDay.reduce((a, d) => a + d.total, 0), orders = byDay.reduce((a, d) => a + d.orders, 0);
    const byHour = Array(24).fill(0); [16, 17, 18, 19, 20, 21, 22].forEach((h, i) => { byHour[h] = [3, 6, 14, 22, 18, 9, 4][i] * Math.ceil(n / 7); });
    return { ok: true, range, label: range === 'week' ? '7 วันล่าสุด' : range === 'month' ? 'เดือนนี้ 10/2026' : 'เดือนที่แล้ว 9/2026',
      from: byDay[0].label, to: byDay[n - 1].label, orders, cancelled: 2, qty: orders * 8, total, discount: orders * 3, avg: Math.round(total / orders), customers: Math.round(orders * .6),
      byDay, byHour, items: [{ name: 'หมูสไลซ์', qty: orders * 3, unit: 'ไม้', sum: orders * 36 }, { name: 'ไก่หมัก', qty: orders * 2, unit: 'ไม้', sum: orders * 24 }, { name: 'ลูกชิ้นปลา', qty: orders, unit: 'ไม้', sum: orders * 12 }],
      unsold: ['เห็ดเข็มทอง'] };
  }
  function demoSummary(justClosed) {
    const live = demo.filter(o => o.status !== 'ยกเลิก'), items = {};
    live.forEach(o => o.lines.forEach(l => {
      const it = items[l.name] || (items[l.name] = { name: l.name, qty: 0, unit: 'ไม้', sum: 0 });
      it.qty += l.qty; it.sum += l.qty * (l.name === 'ปลาหมึกสด' ? 15 : 12);
    }));
    const total = live.reduce((n, o) => n + o.total, 0), discount = live.reduce((n, o) => n + o.discount, 0);
    const d = new Date();
    return {
      ok: true, date: d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(), closed: demoShut, closedAt: demoShut ? demoShutAt : '',
      orders: live.length, pending: live.filter(o => o.status !== 'เสร็จแล้ว').length, cancelled: demo.length - live.length,
      qty: Object.values(items).reduce((n, x) => n + x.qty, 0), free: discount ? 1 : 0, unit: 'ไม้',
      gross: total + discount, discount, total, items: Object.values(items).sort((a, b) => b.qty - a.qty),
      paid: live.filter(o => o.paid).reduce((n, o) => n + o.total, 0), unpaid: live.filter(o => !o.paid).reduce((n, o) => n + o.total, 0),
      paidOrders: live.filter(o => o.paid).length, unpaidOrders: live.filter(o => !o.paid).length,
      saved: justClosed ? true : undefined, notified: false,
    };
  }

  async function api(body) {
    if (!CFG.API_URL) {
      if (body.action === 'status') { const o = demo.find(x => x.id === body.orderId); if (o) o.status = body.status; return { ok: true }; }
      if (body.action === 'paid') { const o = demo.find(x => x.id === body.orderId); if (o) o.paid = body.paid === true; return { ok: true, paid: body.paid === true }; }
      if (body.action === 'photo' || body.action === 'slipPhoto') return { ok: true, photo: demoPhoto };
      if (body.action === 'slipReject') { const o = demo.find(x => x.id === body.orderId); if (o && o.slip) { o.slip.state = 'ไม่ผ่าน'; o.paid = false; } return { ok: true }; }
      if (body.action === 'customer') return { ok: true, count: 3, orders: [
        { id: 'demo-001', date: '2026-10-10', time: '12:01', status: 'กำลังทำ', total: 120, lines: [{ name: 'หมูสไลซ์', qty: 5 }, { name: 'เห็ดเข็มทอง', qty: 3 }, { name: 'ลูกชิ้นปลา', qty: 3 }] },
        { id: 'old-2', date: '2026-10-03', time: '19:20', status: 'เสร็จแล้ว', total: 84, lines: [{ name: 'หมูสไลซ์', qty: 4 }, { name: 'ไก่หมัก', qty: 3 }] },
        { id: 'old-1', date: '2026-09-26', time: '18:05', status: 'เสร็จแล้ว', total: 60, lines: [{ name: 'เนื้อวัวสไลซ์', qty: 5 }] },
      ] };
      if (body.action === 'stock') { const m = demoMenu.find(x => x.name === body.name); if (!m) return { ok: false, error: 'ไม่พบเมนูนี้' }; m.available = body.available === true; return { ok: true, name: m.name, available: m.available }; }
      if (body.action === 'report') return demoReport(body.range);
      if (body.action === 'summary' || body.action === 'closeDay' || body.action === 'openDay') {
        if (body.action === 'closeDay') { demoShut = true; demoShutAt = new Date().toTimeString().slice(0, 5); }
        if (body.action === 'openDay') demoShut = false;
        return demoSummary(body.action === 'closeDay');
      }
      return { ok: true, orders: JSON.parse(JSON.stringify(demo)), closed: demoShut };
    }
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(CFG.API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ key }, body)), signal: ctrl.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }

  // โหลดไฟล์เสียงเตือนของร้านมาเตรียมไว้ (ลองใหม่ได้ไม่เกิน 3 ครั้ง ถ้าเน็ตหลุดตอนโหลด)
  async function loadAlertSound() {
    if (alertBuf || !audio || !CFG.ALERT_SOUND || alertTries >= 3) return;
    alertTries++;
    try {
      const res = await fetch(CFG.ALERT_SOUND);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.arrayBuffer();
      // เรียกแบบมี callback เพราะ Safari รุ่นเก่ายังไม่รองรับแบบ promise
      alertBuf = await new Promise((ok, no) => audio.decodeAudioData(data, ok, no));
      alertTries = 3;
    } catch (e) { alertBuf = null; }
  }

  // เสียงเตือนออเดอร์ใหม่: เล่นไฟล์เสียงของร้าน ถ้าไม่มีไฟล์หรือเล่นไม่ได้ ใช้เสียงติ๊ด 2 ครั้ง
  function beep() {
    if (!audio) return;
    if (alertBuf) {
      try {
        const times = Math.max(1, Math.min(5, Math.floor(Number(CFG.ALERT_TIMES)) || 1));
        for (let k = 0; k < times; k++) {
          const src = audio.createBufferSource();
          src.buffer = alertBuf; src.connect(audio.destination);
          src.start(audio.currentTime + k * (alertBuf.duration + 0.35));
        }
        return;
      } catch (e) {}
    }
    tone();
  }
  // เสียงติ๊ดสั้น 2 ครั้ง: ใช้เมื่อเล่นไฟล์เสียงไม่ได้ และใช้เตือนเมื่อลูกค้าแนบสลิปใหม่
  function tone() {
    if (!audio) return;
    try {
      [0, 0.25].forEach(at => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.3, audio.currentTime + at);
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + at + 0.2);
        o.start(audio.currentTime + at); o.stop(audio.currentTime + at + 0.2);
      });
    } catch (e) {}
  }

  const showPhone = p => /^\d{10}$/.test(p) ? p.slice(0, 3) + '-' + p.slice(3, 6) + '-' + p.slice(6) : p;

  function photoHTML(o) {
    if (!o.hasPhoto) return '';
    const id = esc(o.id);
    const src = photos.get(o.id);
    if (src) return `<button class="card-photo" type="button" data-photo="${id}" aria-label="ขยายรูปของคิว ${esc(o.queue)}"><img src="${esc(src)}" alt="รูปที่ลูกค้าถ่าย"></button>`;
    const active = o.status === 'ใหม่' || o.status === 'กำลังทำ';
    if (active && !photoFailed.has(o.id)) return '<p class="photo-wait">กำลังโหลดรูป…</p>';
    return `<div class="photo-more"><button class="btn quiet small" type="button" data-photo="${id}">ดูรูป</button></div>`;
  }

  async function loadPhoto(id) {
    if (photos.has(id)) return photos.get(id);
    try {
      const data = await api({ action: 'photo', orderId: id });
      if (data.ok && typeof data.photo === 'string' && data.photo.startsWith('data:image/')) {
        photos.set(id, data.photo); photoFailed.delete(id);
        return data.photo;
      }
    } catch (e) {}
    photoFailed.add(id);
    return '';
  }
  // โหลดรูปของออเดอร์ที่ยังไม่เสร็จทีละรูป ออเดอร์ที่เสร็จแล้วค่อยโหลดเมื่อกด "ดูรูป"
  async function loadActivePhotos() {
    if (photoBusy) return;
    photoBusy = true;
    try {
      for (;;) {
        const o = orders.find(x => x.hasPhoto && (x.status === 'ใหม่' || x.status === 'กำลังทำ') && !photos.has(x.id) && !photoFailed.has(x.id));
        if (!o) break;
        await loadPhoto(o.id);
        render();
      }
    } finally { photoBusy = false; }
  }

  // แถบสลิปบนการ์ด: เห็นเมื่อลูกค้าแนบสลิปและร้านยังไม่ได้กด "รับเงินแล้ว"
  function slipHTML(o) {
    const sl = o.slip || {};
    if (!sl.has || o.paid || o.status === 'ยกเลิก') return '';
    const bad = sl.state === 'ไม่ผ่าน';
    const text = bad ? 'สลิปไม่ผ่าน รอลูกค้าแนบใหม่' : sl.dup ? 'สลิปนี้เคยแนบกับออเดอร์อื่นแล้ว ตรวจให้ดี' : 'มีสลิป รอตรวจ';
    return `<div class="slip-row${bad || sl.dup ? ' is-warn' : ''}"><span>${text}</span>
      <button class="btn quiet small" type="button" data-slip="${esc(o.id)}">ดูสลิป</button></div>`;
  }

  // รายการในการ์ด: ถ้าเกิน 6 รายการ ย่อเหลือ 5 รายการแรก และมีปุ่ม "ดูทั้งหมด / ย่อ" (จำไว้ในเครื่องนี้ แม้หน้าจอรีเฟรชเอง)
  const LINES_SHORT = 5, LINES_LONG = 6;
  function linesHTML(o) {
    const long = o.lines.length > LINES_LONG, open = !long || expanded.has(o.id);
    const shown = open ? o.lines : o.lines.slice(0, LINES_SHORT);
    const sticks = o.lines.reduce((a, l) => a + (Number(l.qty) || 0), 0);
    const list = `<ul${open ? '' : ' class="is-short"'}>${shown.map(l => `<li><span>${esc(l.name)}</span><b>× ${esc(l.qty)}</b></li>`).join('')}</ul>`;
    if (!long) return list;
    return list + `<button class="lines-toggle" type="button" data-lines="${esc(o.id)}" aria-expanded="${open}">
      <span>${open ? 'ย่อรายการ' : 'ดูทั้งหมด ' + o.lines.length + ' รายการ (อีก ' + (o.lines.length - LINES_SHORT) + ')'} · รวม ${sticks} ไม้</span><span class="arrow" aria-hidden="true">${open ? '▲' : '▼'}</span></button>`;
  }
  function toggleLines(id) {
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expanded].slice(-50))); } catch (e) {}
    render();
  }

  function card(o) {
    const isNum = /^\d+$/.test(o.table);
    const next = o.status === 'ใหม่' ? ['กำลังทำ', 'เริ่มทำ'] : o.status === 'กำลังทำ' ? ['เสร็จแล้ว', 'ทำเสร็จแล้ว'] : null;
    return `<article class="card" data-status="${esc(o.status)}">
      <div class="card-head">
        <span class="card-table">${o.table ? (isNum ? 'โต๊ะ ' : '') + esc(o.table) : 'คิว ' + esc(o.queue)}</span>
        <div class="card-meta">${o.table ? 'คิว ' + esc(o.queue) : ''}<small>${esc(o.time)}${o.customer ? ' ' + esc(o.customer) : ''}${o.status === 'ยกเลิก' ? ' (ยกเลิก)' : ''}</small></div>
      </div>
      ${o.phone ? `<p class="contact"><a href="tel:${esc(o.phone)}">โทร ${esc(showPhone(o.phone))}</a></p>` : ''}
      ${o.visits > 0 ? `<button class="regular" type="button" data-past="${esc(o.id)}">ลูกค้าเก่า เคยสั่ง ${esc(o.visits)} ครั้ง ดูประวัติ</button>` : ''}
      ${photoHTML(o)}
      ${linesHTML(o)}
      ${o.spice || o.note ? `<div class="tags">${o.spice ? `<p><span class="spice">${esc(o.spice)}</span></p>` : ''}${o.note ? `<p class="note">${esc(o.note)}</p>` : ''}</div>` : ''}
      ${slipHTML(o)}
      ${o.status === 'ยกเลิก' ? '' : `<div class="pay-row">${o.paid
        ? `<button class="undo" type="button" data-pay="${esc(o.id)}" data-paid="0">แก้เป็นยังไม่จ่าย</button>`
        : `<button class="btn quiet small" type="button" data-pay="${esc(o.id)}" data-paid="1">รับเงินแล้ว ${money(o.total)}</button>${o.payQr ? `<button class="btn quiet small" type="button" data-qr="${esc(o.id)}">QR ให้ลูกค้าสแกน</button>` : ''}`}</div>`}
      <div class="card-foot">
        <span class="sum">${money(o.total)}${o.paid ? '<span class="paid-tag">จ่ายแล้ว</span>' : ''}${o.discount > 0 ? `<small>หักโปรแล้ว ${money(o.discount)}</small>` : ''}</span>
        ${o.status === 'ใหม่' ? `<button class="btn quiet small" type="button" data-id="${esc(o.id)}" data-to="ยกเลิก">ยกเลิก</button>` : ''}
        ${next ? `<button class="btn small" type="button" data-id="${esc(o.id)}" data-to="${next[0]}">${next[1]}</button>` : ''}
      </div>
    </article>`;
  }

  function render() {
    const groups = {
      new: orders.filter(o => o.status === 'ใหม่'),
      doing: orders.filter(o => o.status === 'กำลังทำ'),
      done: [],
    };
    // ช่อง "เสร็จแล้ว" แสดง 15 ออเดอร์ล่าสุด แต่ถ้าวันนี้ร้านใช้ปุ่ม "รับเงินแล้ว" ออเดอร์ที่เสร็จแล้วแต่ยังไม่จ่ายจะไม่หลุดจากจอ
    const usesPay = orders.some(o => o.paid || (o.slip && o.slip.has));
    let recent = 0;
    groups.done = orders.filter(o => o.status === 'เสร็จแล้ว' || o.status === 'ยกเลิก').reverse()
      .filter(o => (usesPay && o.status === 'เสร็จแล้ว' && !o.paid) || recent++ < 15);
    const emptyText = { new: 'ยังไม่มีออเดอร์ใหม่', doing: 'ไม่มีออเดอร์ที่กำลังทำ', done: 'ยังไม่มีออเดอร์ที่เสร็จ' };
    Object.keys(groups).forEach(k => {
      $('n-' + k).textContent = k === 'done' ? '' : groups[k].length || '';
      $('c-' + k).innerHTML = groups[k].length ? groups[k].map(card).join('') : `<p class="empty">${emptyText[k]}</p>`;
    });
    const n = groups.new.length;
    document.title = (n ? '(' + n + ') ' : '') + 'ออเดอร์หลังร้าน';
  }

  function setStatus(text, bad) {
    $('status').textContent = text;
    $('status').classList.toggle('bad', !!bad);
  }

  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const data = await api({ action: 'orders' });
      if (!data.ok) {
        // ถ้ายังไม่เคยใส่รหัสเลย แปลว่าร้านเปิดระบบรหัสไว้: ให้ใส่รหัสโดยไม่ต้องขึ้นข้อความผิดพลาด
        if (data.code === 'KEY') { stop(); showGate(key ? data.error : ''); return; }
        throw new Error(data.error);
      }
      orders = data.orders || [];
      payTo = typeof data.payTo === 'string' ? data.payTo : '';
      orders.forEach(o => {
        const p = pending.get(o.id);
        if (!p) return;
        if (o.status === p.status || Date.now() - p.at > PENDING_MS) pending.delete(o.id);   // หลังร้านตามทันแล้ว
        else o.status = p.status;                                                            // ยังไม่ทัน: คงสถานะที่เพิ่งกดไว้
      });
      orders.forEach(o => {
        o.paid = o.paid === true;
        const q = pendingPaid.get(o.id);
        if (!q) return;
        if (o.paid === q.paid || Date.now() - q.at > PENDING_MS) pendingPaid.delete(o.id);
        else o.paid = q.paid;
      });
      orders.forEach(o => {
        o.slip = o.slip && typeof o.slip === 'object' ? o.slip : { has: false, state: '', dup: false };
        const q = pendingSlip.get(o.id);
        if (!q) return;
        if (o.slip.state === q.state || Date.now() - q.at > PENDING_MS) pendingSlip.delete(o.id);
        else o.slip.state = q.state;
      });
      const ids = new Set(orders.map(o => o.id));
      const withSlip = new Set(orders.filter(o => o.slip.has && o.slip.state === 'รอตรวจ').map(o => o.id));
      const newOrder = known && orders.some(o => o.status === 'ใหม่' && !known.has(o.id));
      if (newOrder) beep();
      else if (slipsSeen && [...withSlip].some(id => !slipsSeen.has(id))) tone();   // ลูกค้าเพิ่งแนบสลิป
      known = ids;
      slipsSeen = withSlip;
      if (audio && !alertBuf) loadAlertSound();
      render();
      loadActivePhotos();
      $('gate').hidden = true;
      $('board').hidden = false;
      $('sumBtn').hidden = false;
      $('stockBtn').hidden = false;
      closed = data.closed === true;
      showClosed();
      try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
      const now = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      setStatus((CFG.API_URL ? '' : 'โหมดทดลอง ') + 'อัปเดตล่าสุด ' + now);
    } catch (e) {
      setStatus('เชื่อมต่อไม่ได้ กำลังลองใหม่', true);
    } finally { busy = false; }
  }

  function startPolling() {
    stop();
    refresh();
    timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
  }
  function stop() { if (timer) clearInterval(timer); timer = null; }
  function showGate(msg) {
    $('board').hidden = true; $('gate').hidden = false;
    $('gateMsg').textContent = msg || '';
    $('soundBtn').hidden = true;
    $('sumBtn').hidden = true;
    $('stockBtn').hidden = true;
    showClosed();
    if ($('sum').open) $('sum').close();
    if ($('stock').open) $('stock').close();
    setStatus('');
  }

  // เบราว์เซอร์ยอมให้เล่นเสียงได้หลังจากมีการแตะจอเท่านั้น
  function enableSound() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
    loadAlertSound();
    $('soundBtn').hidden = true;
  }

  $('startBtn').addEventListener('click', () => {
    key = $('key').value.trim();
    if (CFG.API_URL && !key) { $('gateMsg').textContent = 'ใส่รหัสพนักงานก่อน'; return; }
    enableSound();
    $('gateMsg').textContent = '';
    setStatus('กำลังเชื่อมต่อ…');
    known = null;
    startPolling();
  });
  $('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('startBtn').click(); });

  // ดูสลิป: เปิดรูปพร้อมปุ่ม "รับเงินแล้ว" และ "สลิปไม่ถูกต้อง" ให้กดได้ทันทีโดยไม่ต้องปิดรูปก่อน
  async function showSlip(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    let src = photos.get(id + '#slip');
    if (!src) {
      try {
        const data = await api({ action: 'slipPhoto', orderId: id });
        if (data.ok && typeof data.photo === 'string' && data.photo.startsWith('data:image/')) { src = data.photo; photos.set(id + '#slip', src); }
      } catch (e) {}
    }
    if (!src) { setStatus('โหลดรูปสลิปไม่ได้ ลองกดอีกครั้ง', true); return; }
    $('viewerImg').src = src;
    $('viewerActions').hidden = false;
    $('viewerActions').innerHTML = `<button class="btn" type="button" data-pay="${esc(id)}" data-paid="1">รับเงินแล้ว ${money(o.total)}</button>
      ${o.slip.state === 'ไม่ผ่าน' ? '' : `<button class="btn quiet" type="button" data-slip-bad="${esc(id)}">สลิปไม่ถูกต้อง</button>`}`;
    if (!$('viewer').open) $('viewer').showModal();
  }

  // QR จ่ายเงินของคิวนั้นแบบเต็มจอ ให้ลูกค้าสแกนจากเครื่องของร้าน แล้วกด "รับเงินแล้ว" ในหน้าเดียวกัน
  function showPayQr(id) {
    const o = orders.find(x => x.id === id);
    if (!o || !o.payQr) return;
    $('payDlgTitle').textContent = 'คิว ' + o.queue;
    $('payDlgAmount').textContent = money(o.total);
    $('payDlgQr').innerHTML = '';
    let drawn = false;
    if (typeof QRCode !== 'undefined') {
      try { new QRCode($('payDlgQr'), { text: o.payQr, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); $('payDlgQr').removeAttribute('title'); drawn = true; } catch (e) {}
    }
    $('payDlgQr').hidden = !drawn;
    $('payDlgTo').textContent = drawn ? 'สแกนด้วยแอปธนาคาร' + (payTo ? ' · พร้อมเพย์ ' + payTo : '') : 'โหลดตัวสร้าง QR ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองเปิดใหม่';
    $('payDlgActions').innerHTML = `<button class="btn" type="button" data-pay="${esc(o.id)}" data-paid="1">รับเงินแล้ว ${money(o.total)}</button>
      <button class="btn quiet" type="button">ปิด</button>`;
    if (!$('payDlg').open) $('payDlg').showModal();
  }

  async function onBoardClick(e) {
    const lt = e.target.closest('button[data-lines]');
    if (lt) { toggleLines(lt.dataset.lines); return; }
    const qb = e.target.closest('button[data-qr]');
    if (qb) { showPayQr(qb.dataset.qr); return; }
    const sb = e.target.closest('button[data-slip]');
    if (sb) { showSlip(sb.dataset.slip); return; }
    const xb = e.target.closest('button[data-slip-bad]');
    if (xb) {
      // สลิปไม่ถูกต้อง: ลูกค้าจะเห็นข้อความให้แนบใหม่ ร้านยังกด "รับเงินแล้ว" ทีหลังได้ถ้าเงินเข้าจริง
      const id = xb.dataset.slipBad, o = orders.find(x => x.id === id);
      if (!o || !confirm('สลิปของคิว ' + o.queue + ' ไม่ถูกต้อง ให้ลูกค้าแนบใหม่ใช่ไหม')) return;
      const before = o.slip.state, mine = { state: 'ไม่ผ่าน', at: Date.now() };
      pendingSlip.set(id, mine);
      o.slip.state = 'ไม่ผ่าน'; render();
      try {
        const data = await api({ action: 'slipReject', orderId: id });
        if (!data.ok) throw new Error(data.error);
        // บันทึกแล้ว: ถือค่าที่เพิ่งกดไว้อีกแค่ราวหนึ่งรอบของการดึงออเดอร์ ถ้าลูกค้าแนบสลิปใหม่เร็ว ๆ จะได้เห็นทันที
        mine.at = Date.now() - PENDING_MS + 12000;
      } catch (err) {
        if (pendingSlip.get(id) === mine) pendingSlip.delete(id);
        const cur = orders.find(x => x.id === id);
        if (cur && cur.slip.state === 'ไม่ผ่าน') cur.slip.state = before;
        render();
        setStatus('บันทึกไม่สำเร็จ ลองกดอีกครั้ง', true);
      }
      return;
    }
    const pb = e.target.closest('button[data-photo]');
    if (pb) {
      const src = await loadPhoto(pb.dataset.photo);
      if (!src) { setStatus('โหลดรูปไม่ได้ ลองกดอีกครั้ง', true); render(); return; }
      $('viewerImg').src = src;
      $('viewerActions').hidden = true;
      if (!$('viewer').open) $('viewer').showModal();
      render();
      return;
    }
    const hb = e.target.closest('button[data-past]');
    if (hb) { showPast(orders.find(x => x.id === hb.dataset.past)); return; }
    const yb = e.target.closest('button[data-pay]');
    if (yb) {
      // กด "รับเงินแล้ว" หรือแก้กลับ: เปลี่ยนบนจอทันที แล้วค่อยบันทึก ถ้าบันทึกไม่สำเร็จจะคืนค่าเดิม
      const id = yb.dataset.pay, paid = yb.dataset.paid === '1';
      const o = orders.find(x => x.id === id);
      if (!o) return;
      const mine = { paid, at: Date.now() };
      pendingPaid.set(id, mine);
      o.paid = paid; render();
      try {
        const data = await api({ action: 'paid', orderId: id, paid });
        if (!data.ok) throw new Error(data.error);
      } catch (err) {
        if (pendingPaid.get(id) === mine) pendingPaid.delete(id);
        const cur = orders.find(x => x.id === id);
        if (cur && cur.paid === paid) cur.paid = !paid;
        render();
        setStatus('บันทึกการรับเงินไม่สำเร็จ ลองกดอีกครั้ง', true);
      }
      return;
    }
    const b = e.target.closest('button[data-to]');
    if (!b) return;
    const to = b.dataset.to, id = b.dataset.id;
    if (to === 'ยกเลิก' && !confirm('ยกเลิกออเดอร์นี้ใช่ไหม')) return;
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const before = o.status;
    const mine = { status: to, at: Date.now() };
    pending.set(id, mine);
    o.status = to; render();                 // เปลี่ยนบนจอทันที แล้วค่อยบันทึก
    try {
      const data = await api({ action: 'status', orderId: id, status: to });
      if (!data.ok) throw new Error(data.error);
    } catch (err) {
      // บันทึกไม่สำเร็จ: คืนการ์ดกลับที่เดิม (หาออเดอร์ใหม่จากรายการล่าสุด เพราะรายการอาจถูกดึงใหม่ไปแล้ว)
      if (pending.get(id) === mine) pending.delete(id);
      const cur = orders.find(x => x.id === id);
      if (cur && cur.status === to) cur.status = before;
      render();
      setStatus('บันทึกสถานะไม่สำเร็จ ลองกดอีกครั้ง', true);
    }
  }
  $('board').addEventListener('click', onBoardClick);
  // ปุ่มในหน้าดูสลิป: ปิดรูปแล้วทำแบบเดียวกับปุ่มบนการ์ด
  $('viewerActions').addEventListener('click', e => { if (e.target.closest('button')) { $('viewer').close(); onBoardClick(e); } });
  $('payDlgActions').addEventListener('click', e => { if (e.target.closest('button')) { $('payDlg').close(); onBoardClick(e); } });
  $('payDlg').addEventListener('click', e => { if (e.target === $('payDlg')) $('payDlg').close(); });

  // ประวัติการสั่งของลูกค้า LINE เจ้าของออเดอร์นี้ (สูงสุด 10 ครั้งล่าสุด)
  const thaiDate = iso => { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); };
  async function showPast(o) {
    if (!o) return;
    $('pastWho').textContent = (o.customer ? o.customer + ' ' : '') + (o.phone ? 'เบอร์ ' + showPhone(o.phone) : '');
    $('pastList').innerHTML = '<p>กำลังโหลด…</p>';
    if (!$('past').open) $('past').showModal();
    let data = null;
    try { data = await api({ action: 'customer', orderId: o.id }); } catch (e) {}
    if (!data || !data.ok || !Array.isArray(data.orders)) { $('pastList').innerHTML = '<p>โหลดประวัติไม่ได้ ลองกดอีกครั้ง</p>'; return; }
    $('pastList').innerHTML = data.orders.map(h => `<div class="past">
        <div class="past-head"><span>${esc(thaiDate(h.date))} ${esc(h.time)}</span><span>${money(h.total)}</span></div>
        <p>${(h.lines || []).map(l => esc(l.name) + ' × ' + esc(l.qty)).join(', ')}</p>
        ${h.id === o.id ? '<p class="now">ออเดอร์นี้</p>' : h.status === 'ยกเลิก' ? '<p class="now">ยกเลิก</p>' : ''}
      </div>`).join('') || '<p>ยังไม่มีประวัติ</p>';
  }
  $('pastClose').addEventListener('click', () => $('past').close());
  $('past').addEventListener('click', e => { if (e.target === $('past')) $('past').close(); });

  // ---------- สรุปยอดของวัน และปิดรับออเดอร์ ----------
  // กดปุ่ม "สรุปยอด" เพื่อดูยอดได้ตลอดโดยยังไม่ปิดร้าน ในแผ่นสรุปมีปุ่มปิดรับออเดอร์ (ต้องกด 2 ครั้ง กันกดพลาด)
  // หลังปิดรับ ลูกค้าจะสั่งไม่ได้จนกว่าจะกด "เปิดรับออเดอร์อีกครั้ง" หรือขึ้นวันใหม่
  function showClosed() { $('closedBar').hidden = !closed || $('board').hidden; }
  function disarm() { armedAt = 0; $('sumShut').textContent = 'ปิดรับออเดอร์'; }

  function renderSummary(s) {
    closed = s.closed === true;
    showClosed();
    $('sumWhen').textContent = 'วันที่ ' + s.date + (closed ? ' ปิดรับออเดอร์แล้ว' + (s.closedAt ? 'เมื่อ ' + s.closedAt + ' น.' : '') : ' ยังเปิดรับออเดอร์อยู่');
    $('sumWhen').classList.toggle('shut', closed);
    const items = Array.isArray(s.items) ? s.items : [];
    const rows = items.map(x => `<tr><td>${esc(x.name)}</td><td><b>${Number(x.qty)}</b> ${esc(x.unit || '')}</td><td>${money(x.sum)}</td></tr>`).join('');
    $('sumBody').innerHTML =
      (rows ? `<table class="sum-table"><tbody>${rows}</tbody></table>` : '<p class="empty">วันนี้ยังไม่มีออเดอร์</p>') +
      `<div class="sum-totals">
        <div><span>จำนวนออเดอร์</span><b>${Number(s.orders)}</b></div>
        <div><span>ขายไปทั้งหมด</span><b>${Number(s.qty)} ${esc(s.unit || '')}${s.free ? ' (แถมฟรี ' + Number(s.free) + ')' : ''}</b></div>
        ${s.discount ? `<div><span>ยอดก่อนหักโปร</span><b>${money(s.gross)}</b></div><div><span>ส่วนลดโปร</span><b>−${money(s.discount)}</b></div>` : ''}
        <div class="grand"><span>ยอดเงินรวม</span><b>${money(s.total)}</b></div>
        ${s.paidOrders ? `<div><span>เก็บเงินแล้ว (${Number(s.paidOrders)} ออเดอร์)</span><b>${money(s.paid)}</b></div>
        <div><span>ค้างเก็บ (${Number(s.unpaidOrders) || 0} ออเดอร์)</span><b>${money(s.unpaid)}</b></div>` : ''}
      </div>` +
      (s.pending ? `<p class="sum-warn">ยังมี ${Number(s.pending)} ออเดอร์ที่ยังทำไม่เสร็จ (นับรวมในยอดแล้ว)</p>` : '') +
      (s.cancelled ? `<p class="sum-warn">ยกเลิก ${Number(s.cancelled)} ออเดอร์ ไม่นับในยอด</p>` : '');
    $('sumShut').hidden = closed;
    $('sumReopen').hidden = !closed;
    disarm();
  }

  // เรียกหลังร้านแล้ววาดสรุปใหม่ คืนข้อมูลสรุป หรือ null ถ้าไม่สำเร็จ (ข้อความผิดพลาดขึ้นในแผ่นสรุป)
  async function callSummary(body, failText) {
    if (sumBusy) return null;
    sumBusy = true;
    $('sumMsg').textContent = '';
    let data = null;
    try { data = await api(body); } catch (e) {}
    sumBusy = false;
    if (!data || !data.ok || !Array.isArray(data.items)) { $('sumMsg').textContent = (data && data.error) || failText; return null; }
    if (sumRange === 'today') renderSummary(data); else { closed = data.closed === true; showClosed(); }
    return data;
  }

  // ---------- สรุปยอดรายสัปดาห์ / รายเดือน ----------
  let sumRange = 'today', repSeq = 0;
  function setSumTab(range) {
    sumRange = range;
    document.querySelectorAll('.sum-tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.range === range)));
    $('sumTitle').textContent = range === 'today' ? 'สรุปยอดวันนี้' : 'สรุปยอด';
  }
  const barList = (rows, top) => '<ul class="bars">' + rows.map(r =>
    `<li><span>${esc(r.label)}</span><span class="bar${r.value ? (r.value === top ? ' top' : '') : ' zero'}" style="width:${top ? Math.max(1, Math.round(r.value / top * 100)) : 1}%"></span><span class="val">${esc(r.text)}</span></li>`).join('') + '</ul>';
  function renderReport(r) {
    const items = Array.isArray(r.items) ? r.items : [];
    const days = Array.isArray(r.byDay) ? r.byDay : [];
    const hours = Array.isArray(r.byHour) ? r.byHour : [];
    $('sumWhen').textContent = r.label + ' (' + r.from + ' ถึง ' + r.to + ')';
    $('sumWhen').classList.remove('shut');
    const dayTop = Math.max(0, ...days.map(d => Number(d.total) || 0));
    const busy = hours.map((c, h) => ({ h, c: Number(c) || 0 }));
    const firstH = busy.findIndex(x => x.c), lastH = 23 - [...busy].reverse().findIndex(x => x.c);
    const hourRows = firstH < 0 ? [] : busy.slice(firstH, lastH + 1).map(x => ({ label: String(x.h).padStart(2, '0') + ':00', value: x.c, text: x.c + ' ออเดอร์' }));
    const hourTop = Math.max(0, ...hourRows.map(x => x.value));
    const peak = hourRows.find(x => x.value === hourTop && hourTop > 0);
    const itemRows = items.map((x, i) => `<tr><td>${i + 1}. ${esc(x.name)}</td><td><b>${Number(x.qty)}</b> ${esc(x.unit || '')}</td><td>${money(x.sum)}</td></tr>`).join('');
    const unsold = Array.isArray(r.unsold) ? r.unsold : [];
    $('sumBody').innerHTML = !r.orders ? '<p class="empty">ช่วงนี้ยังไม่มีออเดอร์</p>' + (unsold.length ? '' : '') : `<div class="rep">
      <div class="rep-kpis">
        <div class="big"><small>ยอดเงินรวม (หลังหักโปร)</small><b>${money(r.total)}</b></div>
        <div><small>จำนวนออเดอร์</small><b>${Number(r.orders)}</b></div>
        <div><small>เฉลี่ยต่อออเดอร์</small><b>${money(r.avg)}</b></div>
        <div><small>ขายไปทั้งหมด</small><b>${Number(r.qty)}</b> ไม้</div>
        <div><small>ลูกค้า (LINE/เบอร์)</small><b>${Number(r.customers)}</b> คน</div>
      </div>
      <h3>ยอดขายรายวัน</h3>
      ${barList(days.map(d => ({ label: d.label, value: Number(d.total) || 0, text: d.orders ? money(d.total) : '-' })), dayTop)}
      <h3>ช่วงเวลาที่คนสั่งเยอะ${peak ? ' (มากสุด ' + esc(peak.label) + ')' : ''}</h3>
      ${barList(hourRows, hourTop)}
      <h3>เมนูขายดี → ขายน้อย</h3>
      <table class="sum-table"><tbody>${itemRows}</tbody></table>
      ${unsold.length ? `<h3>ไม่มีคนสั่งเลยในช่วงนี้</h3><p class="unsold">${unsold.map(esc).join(', ')}</p>` : ''}
      ${r.cancelled ? `<p class="sum-warn">ยกเลิก ${Number(r.cancelled)} ออเดอร์ ไม่นับในยอด</p>` : ''}
    </div>`;
    $('sumShut').hidden = true; $('sumReopen').hidden = true;
  }
  async function showReport(range) {
    const mine = ++repSeq;
    $('sumWhen').textContent = '';
    $('sumBody').innerHTML = '<p>กำลังโหลด…</p>';
    $('sumShut').hidden = true; $('sumReopen').hidden = true;
    $('sumMsg').textContent = '';
    let data = null;
    try { data = await api({ action: 'report', range }); } catch (e) {}
    if (mine !== repSeq || sumRange !== range) return;   // เปลี่ยนแท็บไปแล้ว
    if (!data || !data.ok || !Array.isArray(data.items)) { $('sumBody').innerHTML = ''; $('sumMsg').textContent = (data && data.error) || 'โหลดสรุปยอดไม่ได้ ลองกดแท็บนี้อีกครั้ง'; return; }
    renderReport(data);
  }
  document.querySelectorAll('.sum-tabs button').forEach(b => b.addEventListener('click', async () => {
    const range = b.dataset.range;
    setSumTab(range);
    disarm();
    if (range !== 'today') { showReport(range); return; }
    repSeq++;
    $('sumWhen').textContent = '';
    $('sumBody').innerHTML = '<p>กำลังโหลด…</p>';
    if (!await callSummary({ action: 'summary' }, 'โหลดสรุปยอดไม่ได้ ปิดหน้านี้แล้วกดปุ่มสรุปยอดอีกครั้ง')) $('sumBody').innerHTML = '';
  }));

  $('sumBtn').addEventListener('click', async () => {
    setSumTab('today'); repSeq++;
    $('sumWhen').textContent = '';
    $('sumBody').innerHTML = '<p>กำลังโหลด…</p>';
    $('sumShut').hidden = true; $('sumReopen').hidden = true;
    if (!$('sum').open) $('sum').showModal();
    if (!await callSummary({ action: 'summary' }, 'โหลดสรุปยอดไม่ได้ ปิดหน้านี้แล้วกดปุ่มสรุปยอดอีกครั้ง')) $('sumBody').innerHTML = '';
  });
  $('sumShut').addEventListener('click', async () => {
    if (sumBusy) return;
    const since = Date.now() - armedAt;
    if (since < 700) return;                    // แตะเบิ้ลเร็ว ๆ ไม่นับเป็นการยืนยัน
    if (since > 8000) {                         // กดครั้งแรก: ขอให้กดอีกครั้งภายใน 8 วินาที
      const mine = armedAt = Date.now();
      $('sumShut').textContent = 'กดอีกครั้งเพื่อยืนยัน ปิดรับออเดอร์';
      setTimeout(() => { if (armedAt === mine) disarm(); }, 8000);
      return;
    }
    armedAt = 0;
    $('sumShut').textContent = 'กำลังปิดรับออเดอร์…';
    const s = await callSummary({ action: 'closeDay' }, 'ปิดรับออเดอร์ไม่สำเร็จ ลองกดอีกครั้ง');
    if (!s) { disarm(); return; }
    $('sumMsg').textContent = 'ปิดรับออเดอร์แล้ว' + (s.saved ? ' จดสรุปลงชีตแล้ว' : ' แต่จดสรุปลงชีตไม่ได้') + (s.notified ? ' และส่งสรุปเข้า LINE แล้ว' : '');
  });
  $('sumReopen').addEventListener('click', async () => {
    const s = await callSummary({ action: 'openDay' }, 'เปิดรับออเดอร์ไม่สำเร็จ ลองกดอีกครั้ง');
    if (s) $('sumMsg').textContent = 'เปิดรับออเดอร์แล้ว ลูกค้าสั่งได้ตามปกติ';
  });
  $('sumBack').addEventListener('click', () => $('sum').close());
  $('sum').addEventListener('click', e => { if (e.target === $('sum')) $('sum').close(); });
  $('sum').addEventListener('close', () => { disarm(); if (timer) refresh(); });

  // ---------- ของหมด / มีขาย ----------
  // แตะที่เมนูเพื่อสลับสถานะ หน้าจอเปลี่ยนทันที แล้วจดลงช่อง "พร้อมขาย" ในแท็บเมนูของชีต ถ้าจดไม่สำเร็จจะเปลี่ยนกลับและแจ้ง
  let stockMenu = [];
  const stockBusy = new Set();
  function renderStock() {
    const cats = [];
    stockMenu.forEach(m => { if (!cats.includes(m.cat)) cats.push(m.cat); });
    const out = stockMenu.filter(m => !m.available).length;
    $('stockList').innerHTML = (out ? `<p class="sum-warn">ตอนนี้ปิดไว้ ${out} เมนู</p>` : '') + cats.map(c => `<h3>${esc(c)}</h3>` + stockMenu.filter(m => m.cat === c).map(m =>
      `<button type="button" class="stock-row${m.available ? '' : ' is-out'}${stockBusy.has(m.name) ? ' is-busy' : ''}" data-stock="${esc(m.name)}" aria-pressed="${m.available ? 'false' : 'true'}">
        <span class="name">${esc(m.name)}</span><span class="pill">${m.available ? 'มีขาย' : 'หมด'}</span></button>`).join('')).join('');
  }
  async function loadStock() {
    $('stockMsg').textContent = '';
    $('stockList').innerHTML = '<p>กำลังโหลดเมนู…</p>';
    try {
      if (!CFG.API_URL) stockMenu = JSON.parse(JSON.stringify(demoMenu));
      else {
        const res = await fetch(CFG.API_URL + '?action=menu', { cache: 'no-store' });
        const data = await res.json();
        if (!data || !data.ok || !Array.isArray(data.menu)) throw new Error('menu');
        stockMenu = data.menu.map(m => ({ cat: String(m.cat), name: String(m.name), available: m.available === true }));
      }
      renderStock();
    } catch (e) {
      $('stockList').innerHTML = '';
      $('stockMsg').textContent = 'โหลดเมนูไม่ได้ ปิดแล้วกดปุ่มอีกครั้ง';
    }
  }
  $('stockBtn').addEventListener('click', () => { if (!$('stock').open) $('stock').showModal(); loadStock(); });
  $('stockList').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-stock]');
    if (!btn) return;
    const m = stockMenu.find(x => x.name === btn.dataset.stock);
    if (!m || stockBusy.has(m.name)) return;
    const want = !m.available;
    m.available = want; stockBusy.add(m.name); renderStock();
    $('stockMsg').textContent = '';
    let data = null;
    try { data = await api({ action: 'stock', name: m.name, available: want }); } catch (err) {}
    stockBusy.delete(m.name);
    if (!data || !data.ok) {
      m.available = !want;
      $('stockMsg').textContent = (data && data.error) || 'บันทึกไม่สำเร็จ ลองแตะอีกครั้ง';
    } else {
      m.available = data.available === true;
      $('stockMsg').textContent = m.name + (m.available ? ' กลับมาขายแล้ว' : ' ตั้งเป็นของหมดแล้ว');
    }
    renderStock();
  });
  $('stockClose').addEventListener('click', () => $('stock').close());
  $('stock').addEventListener('click', e => { if (e.target === $('stock')) $('stock').close(); });

  $('viewerClose').addEventListener('click', () => $('viewer').close());
  $('viewer').addEventListener('click', e => { if (e.target === $('viewer')) $('viewer').close(); });

  document.addEventListener('visibilitychange', () => { if (!document.hidden && timer) refresh(); });

  // ลิงก์ส่วนตัวของร้านมีรหัสต่อท้ายหลังเครื่องหมาย # (ส่วนนี้ไม่ถูกส่งออกไปที่ไหน)
  // เปิดจากลิงก์นั้นครั้งเดียว เครื่องจะจำไว้ ครั้งต่อไปเข้าได้เลยไม่ต้องใส่รหัส
  let saved = '';
  try { saved = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
  const fromLink = (/[#&]k=([^&]+)/.exec(location.hash) || [])[1];
  if (fromLink) {
    try { saved = decodeURIComponent(fromLink).trim().slice(0, 60); } catch (e) {}
    try { localStorage.setItem(KEY_STORE, saved); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  $('key').value = saved;
  if (!CFG.API_URL) $('gateMsg').textContent = 'โหมดทดลอง: กดเริ่มได้เลย ไม่ต้องใส่รหัส';
  else {
    // ลองเข้าเลยทุกครั้ง ถ้าร้านไม่ได้ใช้ระบบรหัส จะเห็นออเดอร์ทันที
    // ถ้าร้านใช้ระบบรหัสและเครื่องนี้ยังไม่มีรหัส หลังร้านจะตอบกลับมา แล้วช่องใส่รหัสจะขึ้นเอง
    key = saved;
    $('gate').hidden = true;
    $('soundBtn').hidden = false;
    // ใช้ click (ไม่ใช่ตอนนิ้วเพิ่งแตะ) เพราะปุ่มเปิดเสียงจะหายไปและหน้าจอขยับ ถ้าขยับก่อนยกนิ้ว การแตะครั้งแรกจะไม่ติด
    document.addEventListener('click', enableSound, { once: true, capture: true });
    setStatus('กำลังเชื่อมต่อ…');
    startPolling();
  }
})();
</script>
</body>
</html>
